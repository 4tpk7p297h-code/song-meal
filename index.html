<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>음식점</title>
<meta name="description" content="노래 분위기로 오늘의 메뉴와 네이버 지도 검색 키워드를 추천합니다.">
<!--
  네이버 지도 API (NCP Maps)
  - Client ID는 웹에 공개되는 값이며, NCP 콘솔의 Web 서비스 URL에 등록된 주소에서만 동작합니다.
  - Client Secret은 절대 이 파일에 넣지 마세요.
  - 사용 API: Dynamic Map, Geocoding(위치 → 좌표), Reverse Geocoding(현재 위치 → 동네 이름)
-->
<script>
  // 인증 실패 시 네이버 지도 스크립트가 호출하는 함수
  window.navermap_authFailure = function () { window.NAVER_MAP_AUTH_FAILED = true; };
</script>
<script defer src="https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=o8sqmz7fug&submodules=geocoder"></script>
<style>
  :root {
    --bg: #faf7f2; --card: #ffffff; --text: #1f1d1a; --muted: #6b665e;
    --line: #e6e0d6; --accent: #d9480f; --accent-weak: #fff0e6; --danger: #c92a2a;
    --chip: #f1ece4;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #171512; --card: #211e1a; --text: #f1ece4; --muted: #a8a196;
      --line: #36312b; --accent: #ff8a4c; --accent-weak: #3a2418; --danger: #ff6b6b;
      --chip: #2d2924;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", "Malgun Gothic", sans-serif;
    line-height: 1.6;
  }
  main { max-width: 640px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { font-size: 28px; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 24px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 20px; margin-bottom: 16px; }
  .card h2 { font-size: 18px; margin: 0 0 12px; }
  dl { margin: 0; display: grid; grid-template-columns: 76px 1fr; gap: 6px 12px; font-size: 14px; }
  dt { color: var(--muted); }
  dd { margin: 0; }
  label { display: block; font-weight: 600; font-size: 14px; margin: 14px 0 6px; }
  label .opt { color: var(--muted); font-weight: 400; }
  input[type=text], input[type=number], select {
    width: 100%; padding: 11px 12px; font-size: 16px; color: var(--text);
    background: var(--bg); border: 1px solid var(--line); border-radius: 10px;
  }
  input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }
  .check { display: flex; gap: 8px; align-items: flex-start; font-weight: 500; margin-top: 16px; }
  .check input { margin-top: 5px; width: 18px; height: 18px; accent-color: var(--accent); }
  button {
    margin-top: 20px; width: 100%; padding: 13px; font-size: 16px; font-weight: 700;
    color: #fff; background: var(--accent); border: 0; border-radius: 10px; cursor: pointer;
  }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button.ghost { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
  .hint { font-size: 13px; color: var(--muted); margin: 6px 0 0; }
  .error { color: var(--danger); font-size: 14px; margin-top: 12px; }
  .hidden { display: none !important; }
  .song { font-size: 20px; font-weight: 700; margin: 0; }
  .mood { margin: 4px 0 12px; }
  .stats { display: flex; flex-wrap: wrap; gap: 8px; }
  .stat { background: var(--chip); border-radius: 999px; padding: 4px 12px; font-size: 13px; }
  .pick { border-top: 1px solid var(--line); padding: 14px 0; }
  .pick:first-of-type { border-top: 0; padding-top: 0; }
  .pick h3 { margin: 0 0 4px; font-size: 17px; }
  .pick p { margin: 0 0 8px; font-size: 14px; }
  .maps { display: flex; flex-wrap: wrap; gap: 8px; }
  .maps a {
    display: inline-flex; align-items: center; gap: 4px; padding: 6px 12px; font-size: 14px;
    color: var(--accent); background: var(--accent-weak); border-radius: 999px; text-decoration: none;
  }
  .maps a:hover { text-decoration: underline; }
  #map { width: 100%; height: 280px; border-radius: 10px; background: var(--chip); }
  .locrow { display: flex; gap: 8px; }
  .locrow input { flex: 1; }
  .locrow button { margin: 0; width: auto; padding: 0 12px; font-size: 14px; white-space: nowrap; }
  footer { text-align: center; color: var(--muted); font-size: 12px; margin-top: 24px; }
</style>
</head>
<body>
<main>
  <h1>🍽️ 음식점</h1>
  <p class="sub">노래 분위기 → 오늘의 메뉴와 네이버 지도 검색 키워드</p>

  <!-- 1. 개인정보 동의 -->
  <section id="consent" class="card">
    <h2>개인정보 수집·이용 동의</h2>
    <dl>
      <dt>수집 항목</dt><dd>노래, 곡 분위기, 인원, 날씨, 위치, 식사 시간, 음식 종류, 음식 조건</dd>
      <dt>이용 목적</dt><dd>음식 및 식당 검색 키워드 추천</dd>
      <dt>처리</dt><dd>입력 정보는 이 브라우저 안에서만 처리되며 서버로 전송하거나 저장하지 않습니다. 지도 버튼을 누르면 위치와 검색어가 네이버 지도로 전달됩니다.</dd>
    </dl>
    <label class="check"><input type="checkbox" id="agree"> 위 내용에 동의합니다.</label>
    <button id="enter" disabled>동의하고 시작하기</button>
    <p class="hint">동의하지 않으면 이용할 수 없습니다.</p>
  </section>

  <!-- 2. 입력 -->
  <form id="form" class="card hidden" autocomplete="off">
    <h2>추천 조건 입력</h2>

    <label for="song">노래</label>
    <input type="text" id="song" placeholder="'가수 - 곡명' (예: 아이유 - 밤편지)">

    <div class="row">
      <div>
        <label for="energy">곡 에너지</label>
        <select id="energy">
          <option value="1">잔잔함</option><option value="2" selected>보통</option><option value="3">신남</option>
        </select>
      </div>
      <div>
        <label for="valence">곡 분위기</label>
        <select id="valence">
          <option value="1">어둡고 차분</option><option value="2" selected>무난</option><option value="3">밝고 경쾌</option>
        </select>
      </div>
    </div>

    <div class="row">
      <div>
        <label for="ppl">인원</label>
        <input type="number" id="ppl" min="1" max="50" value="2">
      </div>
      <div>
        <label for="wx">날씨 <span class="opt">(선택)</span></label>
        <select id="wx">
          <option value="">선택 안 함</option>
          <option>맑음</option><option>흐림</option><option>비</option>
          <option>눈</option><option>더움</option><option>추움</option>
        </select>
      </div>
    </div>

    <label for="loc">위치</label>
    <div class="locrow">
      <input type="text" id="loc" placeholder="동네·지역명 (예: 성수동)">
      <button type="button" class="ghost" id="here">📍 현재 위치</button>
    </div>

    <div class="row">
      <div>
        <label for="meal">식사 시간</label>
        <select id="meal">
          <option>아침</option><option selected>점심</option><option>저녁</option><option>야식</option>
        </select>
      </div>
      <div>
        <label for="kind">음식 종류</label>
        <select id="kind">
          <option selected>상관없음</option>
          <option>한식</option><option>중식</option><option>일식</option><option>양식</option>
          <option>분식</option><option>아시안</option><option>카페·디저트</option>
        </select>
      </div>
    </div>

    <label class="check" style="font-weight:400;font-size:14px">
      <input type="checkbox" id="nospicy"> 매운 음식 제외
    </label>

    <button type="submit">추천받기</button>
    <div id="err" class="error hidden"></div>
  </form>

  <!-- 3. 결과 -->
  <section id="result" class="hidden"></section>

  <footer>※ 선택한 곡 분위기를 바탕으로 한 규칙 기반 추천입니다.</footer>
</main>

<script>
(() => {
  const $ = (id) => document.getElementById(id);

  // ---------- 동의 ----------
  $("agree").addEventListener("change", (e) => { $("enter").disabled = !e.target.checked; });
  $("enter").addEventListener("click", () => {
    if (!$("agree").checked) return;
    $("consent").classList.add("hidden");
    $("form").classList.remove("hidden");
    $("song").focus();
  });

  // ---------- 추천 데이터 (유형 A~F) ----------
  // s: 매운 음식 여부
  const TYPES = {
    A: { mood: "잔잔하고 감성적인 분위기", foods: [
      { food: "전골", kind: "한식", kw: ["전골 맛집", "곱창전골"], reason: "조용히 나눠 먹는 따뜻한 국물이 잔잔한 곡과 잘 맞아요." },
      { food: "수제 파스타", kind: "양식", kw: ["수제 파스타 맛집", "조용한 파스타"], reason: "차분한 분위기에서 천천히 즐기기 좋아요." },
      { food: "이자카야", kind: "일식", kw: ["이자카야", "분위기 좋은 이자카야"], reason: "은은한 조명 아래 감성적인 곡과 어울려요." },
      { food: "샤브샤브", kind: "일식", kw: ["샤브샤브 맛집", "샤브샤브"], reason: "부담 없이 천천히 먹기 좋은 메뉴예요." },
      { food: "딤섬", kind: "중식", kw: ["딤섬 맛집", "딤섬"], reason: "조금씩 나눠 먹으며 대화하기 좋아요." },
    ]},
    B: { mood: "잔잔하지만 밝고 산뜻한 분위기", foods: [
      { food: "브런치", kind: "양식", kw: ["브런치 맛집", "브런치 카페"], reason: "가볍고 산뜻한 곡처럼 여유로운 한 끼예요." },
      { food: "샌드위치", kind: "양식", kw: ["샌드위치 맛집", "수제 샌드위치"], reason: "가볍게 즐기기 좋은 메뉴예요." },
      { food: "디저트 카페", kind: "카페·디저트", kw: ["디저트 카페", "케이크 맛집"], reason: "밝은 분위기에 달콤함을 더해 줘요." },
      { food: "쌀국수", kind: "아시안", kw: ["쌀국수 맛집", "베트남 음식"], reason: "깔끔하고 산뜻한 맛이 곡과 어울려요." },
      { food: "베이커리 카페", kind: "카페·디저트", kw: ["베이커리 카페", "빵 맛집"], reason: "갓 구운 빵과 커피로 여유를 즐겨요." },
      { food: "포케·샐러드", kind: "양식", kw: ["포케 맛집", "샐러드 맛집"], reason: "가볍고 상큼한 한 끼로 좋아요." },
    ]},
    C: { mood: "적당히 경쾌하고 기분 좋은 분위기", foods: [
      { food: "파스타·피자", kind: "양식", kw: ["파스타 맛집", "피자 맛집"], reason: "함께 나눠 먹기 좋은 무난한 메뉴예요." },
      { food: "수제버거", kind: "양식", kw: ["수제버거 맛집", "수제버거"], reason: "경쾌한 리듬처럼 캐주얼한 한 끼예요." },
      { food: "돈카츠", kind: "일식", kw: ["돈카츠 맛집", "돈까스"], reason: "누구나 좋아하는 든든한 메뉴예요." },
      { food: "꿔바로우", kind: "중식", kw: ["꿔바로우 맛집", "중식당"], reason: "바삭하고 새콤달콤해서 기분이 좋아져요." },
      { food: "와플·크로플", kind: "카페·디저트", kw: ["크로플 맛집", "와플 카페"], reason: "기분 좋은 곡처럼 달콤하고 바삭해요." },
      { food: "김밥·분식", kind: "분식", kw: ["김밥 맛집", "분식 맛집"], reason: "가볍고 부담 없는 한 끼예요." },
    ]},
    D: { mood: "신나고 밝은 분위기", foods: [
      { food: "치킨", kind: "한식", kw: ["치킨 맛집", "치킨 호프"], reason: "신나는 곡엔 역시 치킨이에요." },
      { food: "떡볶이", kind: "분식", s: true, kw: ["떡볶이 맛집", "즉석떡볶이"], reason: "흥겨운 분위기에 딱 맞는 분식이에요." },
      { food: "곱창", kind: "한식", kw: ["곱창 맛집", "소곱창"], reason: "북적이는 분위기에서 즐기기 좋아요." },
      { food: "바비큐", kind: "양식", kw: ["바비큐 맛집", "텍사스 바비큐"], reason: "에너지 넘치는 곡과 잘 어울려요." },
      { food: "튀김·순대", kind: "분식", kw: ["튀김 맛집", "순대 맛집"], reason: "왁자지껄 나눠 먹기 좋은 분식이에요." },
      { food: "타코", kind: "아시안", kw: ["타코 맛집", "멕시칸 음식"], reason: "경쾌하고 화려한 맛이에요." },
    ]},
    E: { mood: "강렬하고 묵직한 분위기", foods: [
      { food: "마라탕", kind: "중식", s: true, kw: ["마라탕 맛집", "마라샹궈"], reason: "강렬한 곡엔 얼얼한 맛이 어울려요." },
      { food: "삼겹살 구이", kind: "한식", kw: ["삼겹살 맛집", "고기집"], reason: "묵직한 곡처럼 든든한 고기구이예요." },
      { food: "매운 갈비찜", kind: "한식", s: true, kw: ["매운 갈비찜", "갈비찜 맛집"], reason: "화끈한 맛이 강한 사운드와 어울려요." },
      { food: "짬뽕", kind: "중식", s: true, kw: ["짬뽕 맛집", "불짬뽕"], reason: "얼큰한 국물로 에너지를 채워요." },
      { food: "인도 커리", kind: "아시안", s: true, kw: ["커리 맛집", "인도 음식"], reason: "향신료 가득한 강렬한 맛이에요." },
      { food: "화덕 피자", kind: "양식", kw: ["화덕 피자 맛집", "화덕 피자"], reason: "불맛 가득한 강렬한 메뉴예요." },
    ]},
    F: { mood: "차분하고 서정적인 분위기", foods: [
      { food: "한식 정식", kind: "한식", kw: ["한정식 맛집", "백반 맛집"], reason: "따뜻하고 정갈한 한 끼가 위로가 돼요." },
      { food: "라멘", kind: "일식", kw: ["라멘 맛집", "돈코츠 라멘"], reason: "진한 국물이 서정적인 곡과 어울려요." },
      { food: "우동", kind: "일식", kw: ["우동 맛집", "수제 우동"], reason: "부드럽고 따뜻한 면 요리예요." },
      { food: "스튜", kind: "양식", kw: ["스튜 맛집", "비프 스튜"], reason: "천천히 몸을 녹여 주는 메뉴예요." },
      { food: "짜장면", kind: "중식", kw: ["짜장면 맛집", "중국집"], reason: "익숙하고 편안한 맛이에요." },
    ]},
  };

  // 날씨 보정: 해당 날씨면 이 메뉴들을 먼저 고려
  const WEATHER = {
    "비": [
      { food: "파전", kind: "한식", kw: ["파전 맛집", "전집"], reason: "비 오는 날엔 역시 전이죠." },
      { food: "칼국수", kind: "한식", kw: ["칼국수 맛집", "바지락 칼국수"], reason: "비 오는 날 따뜻한 면 국물이 좋아요." },
    ],
    "더움": [
      { food: "냉면", kind: "한식", kw: ["냉면 맛집", "평양냉면"], reason: "더운 날 시원하게 즐기기 좋아요." },
      { food: "빙수", kind: "카페·디저트", kw: ["빙수 맛집", "빙수 카페"], reason: "더위를 식혀 주는 디저트예요." },
    ],
    "추움": [
      { food: "국밥", kind: "한식", kw: ["국밥 맛집", "순대국"], reason: "추운 날 뜨끈한 국물이 최고예요." },
      { food: "훠궈", kind: "중식", s: true, kw: ["훠궈 맛집", "훠궈"], reason: "추운 날 뜨겁게 끓여 먹기 좋아요." },
    ],
  };
  WEATHER["눈"] = WEATHER["추움"];

  // 에너지(1~3) × 분위기(1~3) → 유형
  function pickType(energy, valence) {
    if (energy === 1) return valence === 3 ? "B" : "A";
    if (energy === 2) return valence === 1 ? "F" : "C";
    return valence === 3 ? "D" : "E";
  }

  const ALL_FOODS = [...Object.values(TYPES).flatMap((t) => t.foods), ...WEATHER["비"], ...WEATHER["더움"], ...WEATHER["추움"]];

  function recommend(v) {
    const type = pickType(v.energy, v.valence);
    const ok = (f) => (v.kind === "상관없음" || f.kind === v.kind) && !(v.nospicy && f.s);
    const picks = [];
    const add = (f) => { if (picks.length < 3 && ok(f) && !picks.some((p) => p.food === f.food)) picks.push(f); };
    const wxFood = (WEATHER[v.wx] || []).find(ok);   // 날씨 메뉴는 조건에 맞는 것 1개까지
    if (wxFood) add(wxFood);
    TYPES[type].foods.forEach(add);
    ALL_FOODS.forEach(add);                          // 음식 종류 조건으로 부족하면 다른 유형에서 채움
    return { type, mood: TYPES[type].mood, picks };
  }

  // ---------- 결과 ----------
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const naverUrl = (loc, kw) => "https://map.naver.com/p/search/" + encodeURIComponent(`${loc} ${kw}`);
  const E_LABEL = ["", "잔잔함", "보통", "신남"], V_LABEL = ["", "어둡고 차분", "무난", "밝고 경쾌"];

  // ---------- 네이버 지도 ----------
  const mapsReady = () => !window.NAVER_MAP_AUTH_FAILED && window.naver && naver.maps && naver.maps.Service;
  const MAP_FAIL = "지도를 불러오지 못했어요. NCP 콘솔에서 Dynamic Map 사용과 Web 서비스 URL 등록을 확인해 주세요.";

  function drawMap(loc) {
    const msg = (t) => { const el = $("mapmsg"); if (el) el.textContent = t; };
    const hideMap = (t) => { const m = $("map"); if (m) m.style.display = "none"; msg(t); };
    if (!mapsReady()) return hideMap(MAP_FAIL);
    naver.maps.Service.geocode({ query: loc }, (status, res) => {
      const a = status === naver.maps.Service.Status.OK && res.v2 && res.v2.addresses && res.v2.addresses[0];
      if (!a) return hideMap(`'${loc}'의 위치를 찾지 못했어요. 동 이름이나 도로명 주소로 입력하면 지도가 표시돼요.`);
      const pos = new naver.maps.LatLng(+a.y, +a.x);
      const map = new naver.maps.Map("map", { center: pos, zoom: 15 });
      new naver.maps.Marker({ position: pos, map });
      msg(a.roadAddress || a.jibunAddress || "");
      setTimeout(() => { if (window.NAVER_MAP_AUTH_FAILED) hideMap(MAP_FAIL); }, 1500);
    });
  }

  // 현재 위치 → 동네 이름 (Reverse Geocoding)
  $("here").addEventListener("click", () => {
    const err = (t) => { $("err").textContent = t; $("err").classList.remove("hidden"); };
    $("err").classList.add("hidden");
    if (!navigator.geolocation) return err("이 브라우저는 위치 정보를 지원하지 않아요.");
    if (!mapsReady()) return err(MAP_FAIL);
    const btn = $("here"); btn.disabled = true; btn.textContent = "찾는 중...";
    const done = () => { btn.disabled = false; btn.textContent = "📍 현재 위치"; };
    navigator.geolocation.getCurrentPosition((p) => {
      naver.maps.Service.reverseGeocode({
        coords: new naver.maps.LatLng(p.coords.latitude, p.coords.longitude),
        orders: naver.maps.Service.OrderType.ADDR,
      }, (status, res) => {
        done();
        const r = status === naver.maps.Service.Status.OK && res.v2 && res.v2.results && res.v2.results[0];
        if (!r) return err("현재 위치의 주소를 찾지 못했어요. 직접 입력해 주세요.");
        const g = r.region;
        $("loc").value = [g.area2 && g.area2.name, g.area3 && g.area3.name].filter(Boolean).join(" ");
      });
    }, () => { done(); err("위치 권한이 거부됐어요. 직접 입력해 주세요."); }, { timeout: 10000 });
  });

  function render(v, r) {
    const picks = r.picks.map((p, i) => `
      <div class="pick">
        <h3>${i + 1}. ${esc(p.food)}</h3>
        <p>${esc(p.reason)}</p>
        <div class="maps">${p.kw.map((k) => `<a href="${naverUrl(v.loc, k)}" target="_blank" rel="noopener">📍 ${esc(k)}</a>`).join("")}</div>
      </div>`).join("");

    $("result").innerHTML = `
      <div class="card">
        <p class="song">🎧 ${esc(v.song || "선택한 곡")}</p>
        <p class="mood">${esc(r.mood)}</p>
        <div class="stats">
          <span class="stat">에너지 ${E_LABEL[v.energy]}</span>
          <span class="stat">${V_LABEL[v.valence]}</span>
          <span class="stat">유형 ${r.type}</span>
          ${v.wx ? `<span class="stat">${esc(v.wx)}</span>` : ""}
          <span class="stat">${esc(v.ppl)}명 · ${esc(v.meal)}</span>
        </div>
      </div>
      <div class="card" id="mapcard">
        <h2>🗺️ ${esc(v.loc)} 주변</h2>
        <div id="map"></div>
        <p class="hint" id="mapmsg"></p>
      </div>
      <div class="card">
        <h2>🍽️ 오늘의 추천 음식 <span style="font-weight:400;font-size:14px;color:var(--muted)">· ${esc(v.loc)}</span></h2>
        ${picks || "<p>조건에 맞는 메뉴가 없어요. 음식 종류나 조건을 바꿔 보세요.</p>"}
      </div>
      <button class="ghost" id="again" type="button">다시 하기</button>`;
    $("result").classList.remove("hidden");
    drawMap(v.loc);
    $("again").addEventListener("click", () => {
      $("result").classList.add("hidden");
      $("form").classList.remove("hidden");
      window.scrollTo({ top: 0, behavior: "smooth" });
    });
  }

  $("form").addEventListener("submit", (e) => {
    e.preventDefault();
    $("err").classList.add("hidden");
    const v = {
      song: $("song").value.trim(),
      energy: +$("energy").value,
      valence: +$("valence").value,
      ppl: $("ppl").value.trim() || "2",
      wx: $("wx").value,
      loc: $("loc").value.trim(),
      meal: $("meal").value,
      kind: $("kind").value,
      nospicy: $("nospicy").checked,
    };
    if (!v.loc) {
      $("err").textContent = "위치를 입력해 주세요.";
      $("err").classList.remove("hidden");
      return;
    }
    $("form").classList.add("hidden");
    render(v, recommend(v));
    window.scrollTo({ top: 0, behavior: "smooth" });
  });
})();
</script>
</body>
</html>
